seed: 42
results_dir: results/runs

dataset:
  name: BasicMotions

features:
  type: signature
  level: 2
  with_time: true
  basepoint: false
  invisibility_reset: false
  lead_lag: false

augmentation:
  random_projection:
    enabled: true
    output_dim: 6
    num_projections: 5
    seed: 42

windowing:
  type: dyadic
  depth: 3
  min_window: 8
  aggregation: concat

model:
  type: logreg
  params:
    C: 1.0
    max_iter: 5000

plotting:
  enabled: true
  datasets: [BasicMotions]
