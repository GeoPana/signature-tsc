seed: 42
results_dir: results/runs

dataset:
  name: BasicMotions

features:
  type: logsig
  level: 3
  with_time: true
  basepoint: false
  invisibility_reset: false
  lead_lag: false

augmentation:
  coordinate_projection:
    enabled: true
    mode: pairs

windowing:
  type: global
  aggregation: concat

model:
  type: logreg
  params:
    C: 1.0
    max_iter: 5000

plotting:
  enabled: true
  datasets: [BasicMotions]
