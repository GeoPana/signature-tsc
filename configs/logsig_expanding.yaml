seed: 42
results_dir: results/runs

dataset:
  name: BasicMotions

features:
  type: logsig
  level: 3
  with_time: true
  basepoint: true
  lead_lag: false

windowing:
  type: expanding
  num_windows: 4
  min_window: 8
  aggregation: concat

model:
  type: logreg
  params:
    C: 1.0
    max_iter: 5000

plotting:
  enabled: true
  datasets: [BasicMotions]
